# Evolution API (el puente con WhatsApp) + su base de datos (Postgres) + Redis.
# Es independiente de docker-compose.yml (que levanta solo el servidor MCP).
#
# Uso:  docker compose -f docker-compose.evolution.yml up -d
#
# Lee el MISMO archivo .env de esta carpeta:
#   EVOLUTION_API_KEY      -> la API key de Evolution (la misma que usa el MCP)
#   EVOLUTION_DB_PASSWORD  -> contrasena de la base de datos (solo letras y numeros)
name: whatsapp-evolution

services:
  evolution-api:
    # Version fija a proposito (ver README, seccion "Por que usamos la version v2.3.7").
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      # Solo accesible desde tu propia computadora. Si el 8080 esta ocupado, cambia el
      # primer numero (p. ej. 127.0.0.1:8081:8080) y tambien EVOLUTION_BASE_URL en .env.
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Falta EVOLUTION_API_KEY en el archivo .env (copia .env.example a .env y escribe tu API key)}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Falta EVOLUTION_DB_PASSWORD en el archivo .env (escribe una contrasena de solo letras y numeros)}@postgres:5432/evolution?schema=public
      # Guarda la sesion de WhatsApp en la base de datos.
      - DATABASE_SAVE_DATA_INSTANCE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:?Falta EVOLUTION_DB_PASSWORD en el archivo .env (escribe una contrasena de solo letras y numeros)}
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
